services:
  - type: web
    name: synthetix-backend
    plan: free
    rootDir: backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 43200
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: FILE_STORAGE_PATH
        value: ./storage
      - key: MAX_UPLOAD_SIZE_MB
        value: 100
      - key: QUALITY_THRESHOLD
        value: 0.65
      - key: MAX_ITERATIONS
        value: 5
      - key: FRONTEND_URL
        sync: false
